{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ form.instance.pk|yesno:"Edit,New" }} Patient{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-4">{{ form.instance.pk|yesno:"Edit,New" }} Patient</h3>
                {% crispy form %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
